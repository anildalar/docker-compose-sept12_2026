services:
  xenforo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - "./xenforo:/var/www/html"
    depends_on:
      - db
  db:
    image: mysql:8.4.11
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - "./database:/var/lib/mysql"
  pma:
    image: phpmyadmin:latest
    restart: always
    ports:
      - 8081:80
    env_file:
      - .env
    depends_on:
      - db

